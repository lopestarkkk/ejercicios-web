<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 02 - Cambiar tamaño de imagen</title>
</head>
<body>

    <h2>Modificar tamaño de Imagen</h2>

    <!-- Formulario con campos de texto para ancho y largo -->
    <label for="ancho">Ancho (px):</label>
    <input type="number" id="ancho" placeholder="Ej: 300"><br><br>

    <label for="largo">Largo/Alto (px):</label>
    <input type="number" id="largo" placeholder="Ej: 200"><br><br>

    <button type="button" onclick="cambiarTamano()">Aplicar Tamaño</button>

    <hr>

    <!-- Imagen dentro de una etiqueta figure -->
    <figure>
        <img id="miImagen" src="https://picsum.photos/300/200" alt="Imagen de prueba" width="300" height="200">
    </figure>

    <script>
        function cambiarTamano() {
            let ancho = document.getElementById("ancho").value;
            let largo = document.getElementById("largo").value;

            if (ancho <= 0 || largo <= 0) {
                alert("Por favor ingresa valores válidos para ancho y largo.");
                return;
            }

            // Seleccionamos la imagen dentro del figure y actualizamos su tamaño
            let img = document.getElementById("miImagen");
            img.style.width = ancho + "px";
            img.style.height = largo + "px";
        }
    </script>

</body>
</html>
